[project]
name = "access-agent"
version = "0.1.0"
description = "One IT access request, built as a workflow and as an agent and measured on the same requests."
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
authors = [{ name = "QuantumCortex.AI" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "anthropic>=2.8,<3",
]

[project.urls]
Homepage = "https://quantumcortex.ai/series/"
Repository = "https://github.com/quantumcortex-ai/access-request-agent"

[project.optional-dependencies]
# Keyless sign-in to Claude on Microsoft Foundry. Not needed with an Anthropic API key.
foundry = ["azure-identity>=1.25"]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/access_agent/gateway.py" = ["S101"]
